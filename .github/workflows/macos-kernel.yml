name: NX721J XNU first-entry kernel

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
    inputs:
      unixnu_repository:
        description: UniXNU repository as owner/name
        required: true
        default: UniXNU/UniXNU
      unixnu_ref:
        description: UniXNU commit used for the NX721J first-entry baseline
        required: true
        default: d1559e69a1c181e68ecfe70a721bc0a436caf2e7
      ipsw_url:
        description: Optional IPSW URL override; empty uses board.toml
        required: false
        default: ""
      pmgr:
        description: Build the experimental NX721J PMGR bridge after the baseline kernel
        type: boolean
        default: false
      ufs_passive:
        description: Include the NX721J UFS register survey in the experimental kernel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nx721j-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout NX721J device repository
        uses: actions/checkout@v4

      - name: Checkout official UniXNU
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.unixnu_repository || 'UniXNU/UniXNU' }}
          ref: ${{ inputs.unixnu_ref || 'd1559e69a1c181e68ecfe70a721bc0a436caf2e7' }}
          path: unixnu
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the device boundary
        run: |
          python3 scripts/test-nx721j-defconfig.py
          python3 scripts/check-nx721j-board.py
          python3 scripts/test-nx721j-payload-validation.py
          python3 -m py_compile \
            scripts/check-nx721j-board.py \
            scripts/test-nx721j-defconfig.py \
            scripts/test-nx721j-payload-validation.py \
            scripts/build-nx721j-payload.py \
            scripts/build-nx721j-kernel-stubs.py

      - name: Report the Apple toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Select defconfig
        working-directory: unixnu
        run: ./unixnu defconfig nx721j_probe_defconfig -D "$GITHUB_WORKSPACE"

      - name: Fetch kernel inputs
        working-directory: unixnu
        run: |
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
            corecrypto-2023 -D "$GITHUB_WORKSPACE"

      - name: Build kernel
        working-directory: unixnu
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}" -D "$GITHUB_WORKSPACE"

      - name: Build the experimental PMGR kernel
        if: ${{ inputs.pmgr || inputs.ufs_passive }}
        working-directory: unixnu
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ github.token }}
          UFS_PASSIVE: ${{ inputs.ufs_passive }}
        run: |
          if [ "$UFS_PASSIVE" = true ]; then
            python3 "$GITHUB_WORKSPACE/scripts/prepare-nx721j-native-ufs.py" --unixnu "$PWD"
          fi
          python3 - "$GITHUB_WORKSPACE" "$UFS_PASSIVE" <<'PY'
          from pathlib import Path
          import sys

          device = Path(sys.argv[1])
          ufs_passive = sys.argv[2] == "true"
          config = device / "configs/nx721j_probe_defconfig"
          text = config.read_text()
          options = (
              "CONFIG_XNU_SHENG_PMGR",
              "CONFIG_XNU_TRUST_CACHE_RUNTIME",
              "CONFIG_XNU_NATIVE_CS_HASH_CACHE",
          )
          if any(f"{option}=" in text for option in options):
              raise SystemExit("Duplicate experimental kernel configuration")
          if ufs_passive:
              option = "CONFIG_XNU_NATIVE_UFS=n\n"
              if text.count(option) != 1:
                  raise SystemExit("Expected one disabled NativeUfs option")
              text = text.replace(option, "CONFIG_XNU_NATIVE_UFS=y\n")
          config.write_text(text.rstrip() + "\n" + "".join(f"{option}=y\n" for option in options))

          board = device / "board.toml"
          text = board.read_text()
          anchor = '  "build-libpthread-kernel.py",\n'
          if text.count(anchor) != 1 or "build-nx721j-pmgr.py" in text:
              raise SystemExit("Unexpected kernel archive list")
          archives = '  "build-nx721j-pmgr.py",\n'
          if ufs_passive:
              archives += '  "build-arm-driver.py NativeUfs",\n'
          board.write_text(text.replace(anchor, anchor + archives))
          PY
          ./unixnu defconfig nx721j_probe_defconfig -D "$GITHUB_WORKSPACE"
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}" -D "$GITHUB_WORKSPACE"
          shopt -s nullglob
          kernels=(out/*/kernel/kernel.macho)
          if [ "${#kernels[@]}" -ne 1 ]; then
            echo "Expected one PMGR kernel" >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/check-nx721j-pmgr.py" "${kernels[0]}"
          if [ "$UFS_PASSIVE" = true ]; then
            python3 - "${kernels[0]}" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          kernel = Path(sys.argv[1])
          symbols = subprocess.check_output(
              ["llvm-nm", "--defined-only", str(kernel)], text=True
          )
          names = {line.split()[-1] for line in symbols.splitlines() if line.split()}
          if "__ZN9NativeUfs5startEP9IOService" not in names:
              raise SystemExit("NX721J passive NativeUfs service missing from kernel")
          if any("NativeUfs9startRoot" in name for name in names):
              raise SystemExit("Unexpected active NativeUfs root transport in kernel")
          if b"NATIVE_UFS NX721J passive survey" not in kernel.read_bytes():
              raise SystemExit("NX721J register survey absent from kernel")
          PY
          fi
          llvm-nm -m --defined-only "${kernels[0]}" | awk '
            $NF == "_sheng_pmgr_run" && ($2 == "(__TEXT_EXEC,__text)" || $2 == "(__TEXT,__text)") {
              print
              pmgr=1
            }
            $NF == "_cs_native4k_hash_cache_version" {
              print
              cache_version=1
            }
            $NF == "_cs_native4k_full_blocks" {
              print
              cache_counter=1
            }
            END {
              if (!pmgr) {
                print "PMGR startup hook missing from kernel text" > "/dev/stderr"
                exit 1
              }
              if (!cache_version || !cache_counter) {
                print "Native 4 KiB signature hash cache missing from kernel" > "/dev/stderr"
                exit 1
              }
            }'
          llvm-objdump -d --disassemble-symbols=_kernel_bootstrap_thread "${kernels[0]}" | awk '
            $NF == "<_trust_cache_runtime_init>" && /[[:space:]]bl[[:space:]]/ {
              print
              found=1
            }
            END {
              if (!found) {
                print "Trust-cache runtime initialization missing from kernel bootstrap" > "/dev/stderr"
                exit 1
              }
            }'

      - name: Upload kernel output and logs
        uses: actions/upload-artifact@v4
        with:
          name: nx721j-kernel-${{ github.run_number }}
          path: |
            unixnu/out/*/kernel/**
            unixnu/out/*/logs/**
            unixnu/out/*/tree/build/sheng-platform-power/build-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs from failed builds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nx721j-kernel-logs-${{ github.run_number }}
          path: unixnu/out/*/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf unixnu/out/ipsw unixnu/out/feeds
          rm -rf out/.cache/firmware unixnu/out/*/tree/.cache/firmware
